<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contadores</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#14131f);--sf:var(--tg-theme-secondary-bg-color,#1e1c2e);--tx:var(--tg-theme-text-color,#ecebf5);--hint:var(--tg-theme-hint-color,#9a97b5);--ac:var(--tg-theme-button-color,#8b7cf6);--act:var(--tg-theme-button-text-color,#fff)}
@media (prefers-color-scheme:light){:root{--bg:var(--tg-theme-bg-color,#fff);--sf:var(--tg-theme-secondary-bg-color,#f1f0f8);--tx:var(--tg-theme-text-color,#1b1a2b);--hint:var(--tg-theme-hint-color,#6b6985);--ac:var(--tg-theme-button-color,#5b4bd6)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 12px}h2{font-size:.95rem;margin:16px 0 6px;color:var(--hint);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{padding:8px 12px;border:0;border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--act);font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input{width:100%;padding:10px 12px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:color-mix(in srgb,var(--hint) 28%,transparent);color:var(--tx);font-weight:500}
.btn.del{background:#e5484d;color:#fff}
.btn:disabled{opacity:.55;cursor:wait}
.card{background:var(--sf);border-radius:14px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.m{color:var(--hint);font-size:.85rem}
.bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--hint) 30%,transparent);margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
details{margin-top:8px}summary{cursor:pointer;color:var(--ac);font-weight:600;padding:4px 0}
.act{margin:10px 0;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--hint) 25%,transparent)}
.act label{display:block;font-size:.8rem;color:var(--hint);margin:6px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{font-size:.82rem;margin:4px 0}.hist b{font-weight:600}
#msg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
#msg div{padding:10px 12px;border-radius:10px;margin-bottom:8px;background:var(--ac);color:var(--act)}
#msg div.e{background:#e5484d;color:#fff}
.empty{color:var(--hint);padding:10px 0}
</style>
</head>
<body>
<main>
<h1>Contadores</h1>
<div id="msg" aria-live="polite"></div>
<div class="seg" id="chats" role="group" aria-label="Chat"></div>
<div id="body"><div class="m">Carregando…</div></div>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const API = "https://bot-vnic.tailbd6ffe.ts.net";      // endereço fixo da API do bot (Tailscale Funnel)
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (n) => Number(n).toLocaleString("pt-BR");
const TIPO = { add: "Saldo atualizado", use: "Gasto", set: "Ajuste manual", "correcao-saldo": "Correção de saldo", "undo-gasto": "Gasto desfeito" };
let D = null, SEL = null; const OPEN = new Set(); let busy = false;

function toast(t, erro) {
  const d = document.createElement("div"); if (erro) d.className = "e"; d.textContent = t; $("msg").appendChild(d);
  setTimeout(() => d.remove(), erro ? 6000 : 3500);
}
async function call(path, method, body) {
  if (!tg || !tg.initData) throw new Error("Abra esta miniapp pelo Telegram (pelo bot), não pelo navegador.");
  let r;
  try { r = await fetch(API + path, { method: method || "GET", headers: { Authorization: "tma " + tg.initData, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch (_) { throw new Error("Não consegui falar com o servidor do bot. Tente de novo em instantes."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Erro " + r.status);
  return j;
}
// mesmo formato aceito pelo bot: dígitos puros ou milhar BR ("12.345")
function num(v, nome) {
  const s = String(v == null ? "" : v).trim().replace(/\s/g, "");
  if (!/^(\d+|\d{1,3}([.,]\d{3})+)$/.test(s)) throw new Error(nome + ": use só números (ex.: 1500 ou 1.500).");
  return Number(s.replace(/[.,]/g, ""));
}
const fd = (iso) => { try { return new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (_) { return ""; } };

function cardHtml(c) {
  const open = OPEN.has(c.id) ? " open" : "";
  const hist = c.history.length ? c.history.map((h) => `<div class="hist"><b>${esc(TIPO[h.type] || h.type)}</b> ${nf(h.before)} → ${nf(h.after)} <span class="m">· ${esc(h.reason)} · ${esc(fd(h.date))}</span></div>`).join("") : `<div class="m">Sem histórico ainda.</div>`;
  return `<div class="card" data-cid="${esc(c.id)}">
  <div class="top"><b>${esc(c.name)}</b><span class="m">${nf(c.current)} / ${nf(c.goal)} (${c.percent}%)</span></div>
  <div class="bar"><i style="width:${c.percent}%"></i></div>
  <div class="m">Saldo atual <b>${nf(c.saldo)}</b> · Gasto <b>${nf(c.spent)}</b> · Faltando <b>${nf(c.faltando)}</b></div>
  <details data-did="${esc(c.id)}"${open}><summary>Ações</summary>
   <div class="act" data-op-group="add"><label>Atualizar saldo — quanto você tem agora (gastos são detectados sozinhos)</label>
     <div class="row"><input name="total" inputmode="numeric" placeholder="ex.: 1500" aria-label="Saldo atual"><button class="btn" data-op="add">Atualizar</button></div></div>
   <div class="act"><label>Registrar gasto</label>
     <div class="g2"><input name="amount" inputmode="numeric" placeholder="Quantidade" aria-label="Quantidade gasta"><input name="note" placeholder="Motivo (opcional)" maxlength="100" aria-label="Motivo"></div>
     <div class="row"><button class="btn" data-op="use">Registrar gasto</button>${c.spentHistory.length ? `<button class="btn alt" data-op="undo">Desfazer último gasto</button>` : ""}</div></div>
   <div class="act"><label>Ajustar saldo manualmente</label>
     <div class="g2"><input name="total" inputmode="numeric" placeholder="Novo saldo" aria-label="Novo saldo"><input name="reason" placeholder="Motivo (opcional)" maxlength="100" aria-label="Motivo do ajuste"></div>
     <div class="row"><button class="btn alt" data-op="set">Ajustar (conta como farm/gasto)</button><button class="btn alt" data-op="correct">Corrigir sem contar</button></div>
     <div class="m" style="margin-top:4px">“Corrigir sem contar” só acerta o saldo, sem mudar o farmado nem o gasto (é o /corrigir do bot).</div></div>
   <div class="act"><label>Histórico recente</label>${hist}
     ${c.spentHistory.length ? `<label>Gastos (do mais recente)</label>${c.spentHistory.map((g) => `<div class="hist">${nf(g.amount)} <span class="m">· ${esc(g.note)} · ${esc(fd(g.date))}</span></div>`).join("")}` : ""}</div>
   ${c.canDelete ? `<div class="act"><button class="btn del" data-op="delete">Remover contador</button></div>` : ""}
  </details></div>`;
}
function render() {
  if (!D) return;
  if (SEL == null || !D.chats.some((c) => c.chatId === SEL)) SEL = D.chats.find((c) => c.counters.length)?.chatId ?? D.chats[0].chatId;
  $("chats").innerHTML = D.chats.map((c) => `<button type="button" data-chat="${c.chatId}" aria-pressed="${c.chatId === SEL}">${esc(c.title)}${c.counters.length ? " (" + c.counters.length + ")" : ""}</button>`).join("");
  const ch = D.chats.find((c) => c.chatId === SEL);
  $("body").innerHTML = `<details data-did="__novo"${OPEN.has("__novo") ? " open" : ""}><summary>+ Novo contador</summary>
    <div class="act" id="novo"><label>Nome</label><input name="name" maxlength="40" placeholder="ex.: Primogemas" aria-label="Nome do contador">
    <div class="g2"><div><label>Saldo inicial</label><input name="initial" inputmode="numeric" placeholder="0" aria-label="Saldo inicial"></div><div><label>Meta</label><input name="goal" inputmode="numeric" placeholder="3200" aria-label="Meta"></div></div>
    <div class="row"><button class="btn" data-op="new">Criar contador</button></div></div></details>` +
    (ch.counters.length ? ch.counters.map(cardHtml).join("") : `<div class="empty">Nenhum contador neste chat ainda.</div>`);
}
async function load() {
  try { D = await call("/api/counters"); render(); }
  catch (e) { $("body").innerHTML = `<div class="card" style="color:#e5484d">${esc(e.message)}<div class="row"><button class="btn" id="rt">Tentar de novo</button></div></div>`; $("rt").onclick = load; }
}
function confirmar(t) { return new Promise((res) => (tg && tg.showConfirm ? tg.showConfirm(t, res) : res(window.confirm(t)))); }

document.addEventListener("toggle", (e) => { const id = e.target.dataset && e.target.dataset.did; if (id) { e.target.open ? OPEN.add(id) : OPEN.delete(id); } }, true);
document.addEventListener("click", async (e) => {
  const ch = e.target.closest("[data-chat]");
  if (ch) { SEL = Number(ch.dataset.chat); render(); return; }
  const b = e.target.closest("[data-op]"); if (!b || busy) return;
  const op = b.dataset.op, scope = b.closest(".act"), card = b.closest("[data-cid]");
  const val = (n) => (scope.querySelector(`[name=${n}]`) || {}).value;
  const base = `/api/counters/${SEL}`, cid = card && card.dataset.cid;
  try {
    let path, body, ok;
    if (op === "new") { path = `${base}/new`; body = { name: (val("name") || "").trim(), initial: num(val("initial") || "0", "Saldo inicial"), goal: num(val("goal"), "Meta") }; ok = "Contador criado."; }
    else if (op === "add") { path = `${base}/${cid}/add`; body = { total: num(val("total"), "Saldo atual") }; }
    else if (op === "use") { path = `${base}/${cid}/use`; body = { amount: num(val("amount"), "Quantidade"), note: val("note") }; ok = "Gasto registrado."; }
    else if (op === "set" || op === "correct") { path = `${base}/${cid}/${op}`; body = { total: num(val("total"), "Novo saldo"), reason: val("reason") }; ok = op === "set" ? "Saldo ajustado." : "Saldo corrigido (sem contar)."; }
    else if (op === "undo") { path = `${base}/${cid}/undo`; body = {}; ok = "Último gasto desfeito."; }
    else if (op === "delete") { if (!(await confirmar("Remover este contador? Isso não pode ser desfeito."))) return; path = `${base}/${cid}/delete`; body = {}; ok = "Contador removido."; }
    busy = true; b.disabled = true;
    const r = await call(path, "POST", body);
    toast(op === "add" ? (r.gastoDetectado > 0 ? `Saldo atualizado. Gasto detectado: ${nf(r.gastoDetectado)}.` : "Saldo atualizado.") : ok);
    await load();
  } catch (err) { toast(err.message, true); }
  finally { busy = false; if (b.isConnected) b.disabled = false; }
});
load();
</script>
<script src="../extras.js"></script>
</body>
</html>

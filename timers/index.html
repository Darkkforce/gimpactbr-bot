<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#14131f);--sf:var(--tg-theme-secondary-bg-color,#1e1c2e);--tx:var(--tg-theme-text-color,#ecebf5);--hint:var(--tg-theme-hint-color,#9a97b5);--ac:var(--tg-theme-button-color,#8b7cf6);--act:var(--tg-theme-button-text-color,#fff)}
@media (prefers-color-scheme:light){:root{--bg:var(--tg-theme-bg-color,#fff);--sf:var(--tg-theme-secondary-bg-color,#f1f0f8);--tx:var(--tg-theme-text-color,#1b1a2b);--hint:var(--tg-theme-hint-color,#6b6985);--ac:var(--tg-theme-button-color,#5b4bd6)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{padding:8px 12px;border:0;border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--act);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{width:100%;padding:10px 12px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font:inherit;font-weight:600;cursor:pointer}
.btn.del{background:#e5484d;color:#fff}.btn.alt{background:color-mix(in srgb,var(--hint) 28%,transparent);color:var(--tx);font-weight:500}
.btn:disabled{opacity:.55;cursor:wait}
.card{background:var(--sf);border-radius:14px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ac);white-space:nowrap}
.m{color:var(--hint);font-size:.85rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.tag{font-size:.78rem;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--hint) 22%,transparent)}
details{margin-top:6px}summary{cursor:pointer;color:var(--ac);font-weight:600;padding:4px 0}
.act{margin:10px 0;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--hint) 25%,transparent)}
label{display:block;font-size:.8rem;color:var(--hint);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem;color:var(--tx)}
#msg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:20}
#msg div{padding:10px 12px;border-radius:10px;margin-bottom:8px;background:var(--ac);color:var(--act)}#msg div.e{background:#e5484d;color:#fff}
.empty{color:var(--hint);padding:10px 0}
.help{margin-top:16px;font-size:.82rem;color:var(--hint)}.help button{margin-top:6px}.dbg{font-size:.8rem;white-space:pre-wrap;word-break:break-word}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Timers</h1>
<div id="msg" aria-live="polite"></div>
<div class="seg" id="chats" role="group" aria-label="Chat"></div>
<div id="body"><div class="m">Carregando…</div></div>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const API = "https://bot-vnic.tailbd6ffe.ts.net";      // endereço fixo da API do bot (Tailscale Funnel)
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const REC = { daily: "Diário", weekly: "Semanal", monthly: "Mensal" };
let D = null, SEL = null, DEBUG = false, OFF = 0, busy = false, formOpen = false;

function toast(t, erro) { const d = document.createElement("div"); if (erro) d.className = "e"; d.textContent = t; $("msg").appendChild(d); setTimeout(() => d.remove(), erro ? 6500 : 4500); }
async function call(path, method, body) {
  if (!tg || !tg.initData) throw new Error("Abra esta miniapp pelo Telegram (pelo bot), não pelo navegador.");
  let r;
  try { r = await fetch(API + path, { method: method || "GET", headers: { Authorization: "tma " + tg.initData, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch (_) { throw new Error("Não consegui falar com o servidor do bot. Tente de novo em instantes."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Erro " + r.status);
  return j;
}
const fmtRest = (ms) => {
  if (ms <= 0) return "finalizando…";
  let s = Math.floor(ms / 1000); const d = Math.floor(s / 86400); s %= 86400; const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
  return (d ? d + "d " : "") + (h || d ? h + "h " : "") + (m || h || d ? m + "m " : "") + s + "s";
};
const fmtData = (iso) => { try { return new Date(iso).toLocaleString("pt-BR", { timeZone: D && D.tz || undefined, day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (_) { return iso; } };
const intervalo = (ms) => { const s = ms / 1000; return s % 86400 === 0 ? `A cada ${s / 86400}d` : s % 3600 === 0 ? `A cada ${s / 3600}h` : `A cada ${s / 60}m`; };
const avisoTxt = (m) => (m >= 60 && m % 60 === 0 ? `${m / 60}h` : `${m}m`);

function cardHtml(t) {
  const tags = [t.recurrence ? "🔁 " + REC[t.recurrence] : t.intervalMs ? "🔁 " + intervalo(t.intervalMs) : "", t.reminderMinutes ? "🔔 aviso " + avisoTxt(t.reminderMinutes) : "", t.deleteOnRecurrence ? "🗑️ mensagem estática" : "", t.hasPhoto ? "🖼️ com foto" : ""].filter(Boolean);
  return `<div class="card"><div class="top"><b>${esc(t.name)}</b><span class="cd" data-t="${esc(t.targetDate)}"></span></div>
  <div class="m">Finaliza em ${esc(fmtData(t.targetDate))}</div>
  ${tags.length ? `<div class="tags">${tags.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</div>` : ""}
  ${t.canDelete ? `<div class="row"><button class="btn del" data-del="${esc(t.id)}">Remover</button></div>` : ""}</div>`;
}
function formHtml(L) {
  return `<details id="novo"${formOpen ? " open" : ""}><summary>+ Novo timer</summary><div class="act">
  <label for="f-name">Nome</label><input id="f-name" maxlength="80" placeholder="ex.: Banner da Mavuika">
  <div class="g2"><div><label for="f-date">Data</label><input id="f-date" type="date"></div><div><label for="f-time">Hora</label><input id="f-time" type="time"></div></div>
  <div class="m" style="margin-top:4px">Horário do bot (${esc(D.tz)}).</div>
  <label>Aviso antes do fim (opcional)</label>
  <div class="g2"><input id="f-rem" inputmode="numeric" placeholder="ex.: 30" aria-label="Aviso antes"><select id="f-remu" aria-label="Unidade do aviso"><option value="1">minutos</option><option value="60">horas</option></select></div>
  <label for="f-rep">Repetir</label>
  <select id="f-rep"><option value="">Não repete</option><option value="daily">Todo dia</option><option value="weekly">Toda semana</option><option value="monthly">Todo mês</option><option value="int">A cada…</option></select>
  <div class="g2 hide" id="f-intbox"><input id="f-int" inputmode="numeric" placeholder="ex.: 6" aria-label="Intervalo"><select id="f-intu" aria-label="Unidade do intervalo"><option value="1">minutos</option><option value="60" selected>horas</option><option value="1440">dias</option></select></div>
  <label class="chk"><input type="checkbox" id="f-static"> Mensagem estática (mostra só o nome, sem contagem)</label>
  <div class="m" style="margin-top:8px">O timer vira uma mensagem no chat selecionado. Limites: ${L.perChat} ativos por chat; membros: ${L.perUser} ativos e repetição de no mínimo ${L.minIntervalMinMember / 60} h (admins não têm esses limites). Para anexar foto, use o comando /timer com a imagem.</div>
  <div class="row"><button class="btn" id="criar">Criar timer</button></div></div></details>`;
}
function dbgHtml(d) {
  const ex = d.excluidos.length ? d.excluidos.map((x) => `• ${esc(x.title)} (${x.chatId})${x.itens != null ? " — " + x.itens + " timer(s)" : ""}${x.visto ? ", bot já viu você" : ""}: ${esc(x.motivo)}`).join("\n") : "Nenhum grupo foi descartado.";
  return `<div class="card dbg" style="margin-top:8px">Grupos em que o bot já viu você: ${d.gruposConhecidosDoUsuario}\n` + (d.gruposComItens != null ? `Grupos com timers ativos (visível só a superusers): ${d.gruposComItens}\n` : "") +
    `\nDescartados (ou aceitos por regra alternativa):\n${ex}` + (d.ocultos ? `\n\n+ ${d.ocultos} grupo(s) com timers onde você não é membro (nome e dados ocultos por privacidade).` : "") + `</div>`;
}
function render() {
  if (!D) return;
  if (SEL == null || !D.chats.some((c) => c.chatId === SEL)) SEL = (D.chats.find((c) => c.timers.length) || D.chats[0]).chatId;
  $("chats").innerHTML = D.chats.map((c) => `<button type="button" data-chat="${c.chatId}" aria-pressed="${c.chatId === SEL}">${esc(c.title)}${c.timers.length ? " (" + c.timers.length + ")" : ""}</button>`).join("");
  const ch = D.chats.find((c) => c.chatId === SEL);
  $("body").innerHTML = formHtml(D.limits) + (ch.timers.length ? ch.timers.map(cardHtml).join("") : `<div class="empty">Nenhum timer ativo neste chat.</div>`) +
    `<div class="help">Não vê um grupo aqui? A lista mostra grupos onde você é membro e que tenham timers ativos, ou onde o bot já viu você escrever. Crie um timer no grupo com <b>/timer</b> (ou mande qualquer mensagem lá) e recarregue.<div><button type="button" class="btn alt" id="dbgbtn">Ver diagnóstico</button></div>${D.debug ? dbgHtml(D.debug) : ""}</div>`;
  tick();
}
function tick() {
  const agora = Date.now() + OFF; let vencido = false;
  document.querySelectorAll("[data-t]").forEach((el) => { const r = Date.parse(el.dataset.t) - agora; el.textContent = fmtRest(r); if (r <= 0) vencido = true; });
  if (vencido && !tick.agendado) { tick.agendado = true; setTimeout(() => { tick.agendado = false; load(); }, 4000); }
}
setInterval(tick, 1000);
async function load() {
  try { D = await call("/api/timers" + (DEBUG ? "?debug=1" : "")); OFF = Date.parse(D.serverNow) - Date.now(); render(); }
  catch (e) { $("body").innerHTML = `<div class="card" style="color:#e5484d">${esc(e.message)}<div class="row"><button class="btn" id="rt">Tentar de novo</button></div></div>`; $("rt").onclick = load; }
}
const confirmar = (t) => new Promise((res) => (tg && tg.showConfirm ? tg.showConfirm(t, res) : res(window.confirm(t))));
const posint = (v, nome) => { const s = String(v || "").trim(); if (!/^\d+$/.test(s) || Number(s) < 1) throw new Error(nome + ": use um número inteiro maior que zero."); return Number(s); };

document.addEventListener("toggle", (e) => { if (e.target.id === "novo") formOpen = e.target.open; }, true);
document.addEventListener("change", (e) => { if (e.target.id === "f-rep") $("f-intbox").classList.toggle("hide", e.target.value !== "int"); });
document.addEventListener("click", async (e) => {
  if (e.target.closest("#dbgbtn")) { DEBUG = true; await load(); return; }
  const ch = e.target.closest("[data-chat]"); if (ch) { SEL = Number(ch.dataset.chat); render(); return; }
  if (busy) return;
  const del = e.target.closest("[data-del]"), cr = e.target.closest("#criar");
  try {
    if (del) {
      if (!(await confirmar("Remover este timer?"))) return;
      busy = true; del.disabled = true;
      await call(`/api/timers/${SEL}/${del.dataset.del}/delete`, "POST", {}); toast("Timer removido."); await load();
    } else if (cr) {
      const [y, mo, d] = ($("f-date").value || "").split("-").map(Number), [h, mi] = ($("f-time").value || "").split(":").map(Number);
      if (!y || !Number.isInteger(h)) throw new Error("Informe a data e a hora.");
      const body = { name: $("f-name").value, year: y, month: mo, day: d, hours: h, minutes: mi, deleteOnRecurrence: $("f-static").checked };
      if ($("f-rem").value.trim()) body.reminderMinutes = posint($("f-rem").value, "Aviso") * Number($("f-remu").value);
      const rep = $("f-rep").value;
      if (rep === "int") body.intervalMinutes = posint($("f-int").value, "Intervalo") * Number($("f-intu").value); else if (rep) body.recurrence = rep;
      busy = true; cr.disabled = true;
      const r = await call(`/api/timers/${SEL}/new`, "POST", body);
      toast("Timer criado e postado no chat."); if (r.warning) toast(r.warning); formOpen = false; await load();
    }
  } catch (err) { toast(err.message, true); }
  finally { busy = false; if (del && del.isConnected) del.disabled = false; if (cr && cr.isConnected) cr.disabled = false; }
});
load();
</script>
<script src="../extras.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoje — Genshin, HSR e ZZZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#14131f);--sf:var(--tg-theme-secondary-bg-color,#1e1c2e);--tx:var(--tg-theme-text-color,#ecebf5);--hint:var(--tg-theme-hint-color,#9a97b5);--ac:var(--tg-theme-button-color,#8b7cf6);--act:var(--tg-theme-button-text-color,#fff)}
@media (prefers-color-scheme:light){:root{--bg:var(--tg-theme-bg-color,#fff);--sf:var(--tg-theme-secondary-bg-color,#f1f0f8);--tx:var(--tg-theme-text-color,#1b1a2b);--hint:var(--tg-theme-hint-color,#6b6985);--ac:var(--tg-theme-button-color,#5b4bd6)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 12px}h2{font-size:.95rem;margin:16px 0 6px;color:var(--hint);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.seg button{flex:1;min-width:0;padding:9px 10px;border:0;border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--act);font-weight:600}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border-radius:14px;padding:12px;margin-bottom:8px}
.t{font-weight:600}.m{color:var(--hint);font-size:.85rem;margin-top:2px}
.bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--hint) 30%,transparent);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.s5{font-weight:700}
.code{display:flex;justify-content:space-between;align-items:center;gap:10px}
.code code{font-size:1rem;font-weight:700;letter-spacing:.03em;word-break:break-all}
.cp{border:0;border-radius:8px;padding:7px 12px;background:var(--ac);color:var(--act);font:inherit;cursor:pointer;white-space:nowrap}
.lnk{display:inline-block;margin-top:6px;color:var(--ac)}
.err{color:#e5484d}.err button{margin-top:8px;padding:8px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font:inherit}
.up{color:var(--hint);font-size:.8rem;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>Hoje</h1>
<div class="seg" id="tabs" role="group" aria-label="Seção"></div>
<div class="seg" id="games" role="group" aria-label="Jogo"></div>
<div id="out" aria-live="polite"></div>
<div class="up" id="up"></div>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// mesmas fontes públicas que o bot usa
const GAMES = {
  genshin: { n: "Genshin", cal: "genshin", code: "genshin", url: "https://genshin.hoyoverse.com/pt-pt/gift", ban: true },
  hsr: { n: "Star Rail", cal: "starrail", code: "hkrpg", url: "https://hsr.hoyoverse.com/gift", ban: true },
  zzz: { n: "Zenless", cal: "zenless", code: "nap", url: "https://zenless.hoyoverse.com/redemption", ban: false },
};
const TABS = { eventos: "Eventos", banners: "Banners", farm: "Farm", codigos: "Códigos" };
const ENDGAME = { ChallengeTypeStory: "🏛 Salão do Esquecimento", ChallengeTypeChasm: "📖 Pura Ficção", ChallengeTypeBoss: "⚔️ Sombra Apocalíptica", ChallengeTypePeak: "🌌 Anomalia de Arbitragem" };
const TTL = 5 * 60 * 1000, SANE = 1600000000;
const DIAS = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
const DIA_PT = { monday: "Seg", tuesday: "Ter", wednesday: "Qua", thursday: "Qui", friday: "Sex", saturday: "Sáb", sunday: "Dom" };
const PAR = { monday: "Seg/Qui", thursday: "Seg/Qui", tuesday: "Ter/Sex", friday: "Ter/Sex", wednesday: "Qua/Sáb", saturday: "Qua/Sáb", sunday: "Todos os domínios" };
const diaDeFarm = () => new Intl.DateTimeFormat("en-US", { timeZone: "America/Sao_Paulo", weekday: "long" }).format(new Date(Date.now() - 6 * 3600 * 1000)).toLowerCase();
let T = "eventos", G = "genshin", D = diaDeFarm(), tok = 0; const cache = new Map();
// hoje.json publicado pelo bot na branch "dados" do repositório do hub. Se o site não estiver em usuario.github.io/repositorio,
// preencha DADOS_URL à mão (ex.: "https://raw.githubusercontent.com/usuario/repositorio/dados/hoje.json").
const DADOS_URL = "";
const botUrls = () => {
  const v = "?v=" + Math.floor(Date.now() / 600000), h = location.hostname, repo = location.pathname.split("/")[1];
  const raw = DADOS_URL || (h.endsWith(".github.io") && repo ? `https://raw.githubusercontent.com/${h.split(".")[0]}/${repo}/dados/hoje.json` : "");
  return [raw, "../hoje.json"].filter(Boolean).map((u) => u + v);
};
async function getBot() { let err; for (const u of botUrls()) { try { return await get(u); } catch (e) { err = e; } } throw err || new Error("sem endereço"); }

const clean = (n) => typeof n !== "string" ? "" : n.replace(/&nbsp;/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/<\/?[a-zA-Z][^>]*>/g, "").replace(/\s+/g, " ").trim();
const dfmt = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const fd = (u) => dfmt.format(new Date(u * 1000)).replace(",", "");
const rem = (s) => { const h = Math.max(1, Math.ceil(s / 3600)), d = Math.floor(h / 24), r = h % 24; return d === 0 ? r + "h" : r === 0 ? d + "d" : d + "d " + r + "h"; };
const okEnd = (b) => b.end_time > b.start_time && b.end_time > SANE;

async function get(url) {
  const hit = cache.get(url); if (hit && Date.now() - hit.t < TTL) return hit;
  const c = new AbortController(), id = setTimeout(() => c.abort(), 15000);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); const o = { t: Date.now(), d: await r.json() }; cache.set(url, o); return o; }
  finally { clearTimeout(id); }
}
const calUrl = (g) => "https://api.ennead.cc/mihoyo/" + GAMES[g].cal + "/calendar?lang=pt-pt";
const codeUrl = (g) => "https://hoyo-codes.seria.moe/codes?game=" + GAMES[g].code;
// Códigos: a API principal pode bloquear o navegador (CORS). Tenta, em ordem: ela mesma, o endpoint de códigos do
// ennead (mesmo servidor que já serve os eventos) e dois proxies CORS públicos (só pra ler dado público).
const PROXY = [(u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u), (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)];
async function raw(url) {
  const c = new AbortController(), id = setTimeout(() => c.abort(), 7000);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(id); }
}
function normCodes(d) {
  const a = Array.isArray(d) ? d : (d && (d.codes || d.active));
  if (!Array.isArray(a)) return null;
  return a.map((c) => ({ code: c.code, status: c.status, rewards: Array.isArray(c.rewards) ? c.rewards.join(", ") : c.rewards })).filter((c) => c.code && (c.status === undefined || c.status === "OK"));
}
async function getCodes(g) {
  const key = "codes:" + g, hit = cache.get(key); if (hit && Date.now() - hit.t < TTL) return hit;
  try {   // 1) arquivo publicado pelo bot (se tiver menos de 24h)
    const j = (await getBot()).d, l = j && j.codes && j.codes[g];
    if (Array.isArray(l) && (Date.now() - Date.parse(j.generatedAt)) / 36e5 < 24) { const o = { t: Date.now(), d: l, src: "bot" }; cache.set(key, o); return o; }
  } catch (_) { /* sem arquivo do bot: segue pras outras rotas */ }
  const main = codeUrl(g), alt = "https://api.ennead.cc/mihoyo/" + GAMES[g].cal + "/codes", falhas = [];
  for (const [nome, url] of [["hoyo-codes", main], ["ennead", alt], ["proxy 1", PROXY[0](main)], ["proxy 2", PROXY[1](main)]]) {
    try { const l = normCodes(await raw(url)); if (l) { const o = { t: Date.now(), d: l, src: nome }; cache.set(key, o); return o; } falhas.push(nome + ": resposta sem lista"); }
    catch (e) { falhas.push(nome + ": " + (e.name === "AbortError" ? "tempo esgotado" : e.message)); }
  }
  throw new Error(falhas.join(" · "));
}

function items(b) { const a = [...(b.characters || []), ...(b.weapons || []), ...(b.light_cones || [])].sort((x, y) => (y.rarity || 0) - (x.rarity || 0)); return a.map((i) => (i.rarity >= 5 ? `<span class="s5">${esc(i.name)}</span>` : esc(i.name)) + ` (${esc(i.rarity)}★)`).join(", ") || "(sem detalhe de itens)"; }
function card(x, now, up, extra) {
  const ended = okEnd(x), prog = !up && ended ? Math.min(100, Math.max(0, ((now - x.start_time) / (x.end_time - x.start_time)) * 100)) : null;
  const when = !ended ? (up ? "Começa em " + fd(x.start_time) + " — fim ainda não anunciado" : "Desde " + fd(x.start_time) + " — fim ainda não anunciado")
    : fd(x.start_time) + " → " + fd(x.end_time) + (up ? " · começa em " + rem(x.start_time - now) : " · faltam " + rem(x.end_time - now));
  return `<div class="card"><div class="t">${extra || ""}${esc(x.name)}</div>${x.sub ? `<div class="m">${x.sub}</div>` : ""}<div class="m">${when}</div>${prog !== null ? `<div class="bar"><i style="width:${prog}%"></i></div>` : ""}</div>`;
}
const sec = (t, list) => list.length ? `<h2>${t}</h2>${list.join("")}` : "";

function viewEventos(cal) {
  const now = Date.now() / 1000, ev = (cal.events || []).map((e) => ({ ...e, name: clean(e.name) })).filter((e) => e.name);
  const act = ev.filter((e) => e.start_time <= now && e.end_time >= now).sort((a, b) => a.end_time - b.end_time);
  const nxt = ev.filter((e) => e.start_time > now).sort((a, b) => a.start_time - b.start_time).slice(0, 5);
  let h = sec("Ativos agora", act.map((e) => card(e, now, false))) + sec("Próximos", nxt.map((e) => card(e, now, true)));
  if (G === "hsr" && Array.isArray(cal.challenges)) {
    const ch = cal.challenges.map((c) => ({ ...c, name: clean(c.name) }));
    const lab = (c) => (ENDGAME[c.type_name] || esc(c.type_name)) + " — ";
    h += sec("Endgame — em andamento", ch.filter((c) => c.start_time <= now && c.end_time >= now).sort((a, b) => a.start_time - b.start_time).map((c) => card(c, now, false, lab(c))))
      + sec("Endgame — próximos", ch.filter((c) => c.start_time > now).sort((a, b) => a.start_time - b.start_time).map((c) => card(c, now, true, lab(c))));
  }
  return h || `<div class="m">Nenhum evento ativo ou próximo encontrado.</div>`;
}
function viewBanners(cal) {
  const now = Date.now() / 1000, bn = (cal.banners || []).map((b) => ({ ...b, name: clean(b.name), sub: items(b) }));
  const act = bn.filter((b) => b.start_time <= now && okEnd(b) && b.end_time >= now);
  const nxt = bn.filter((b) => b.start_time > now).sort((a, b) => a.start_time - b.start_time);
  return sec("Ativos agora", act.map((b) => card(b, now, false))) + sec("Próximos", nxt.map((b) => card(b, now, true))) || `<div class="m">Nenhum banner ativo ou próximo encontrado.</div>`;
}
function viewFarm(j) {
  const days = j.farm && j.farm.days;
  if (!days) return `<div class="m">O bot ainda não gerou o farm. Tente de novo em alguns minutos.</div>`;
  const chips = `<div class="seg" role="group" aria-label="Dia">${DIAS.map((d) => `<button data-d="${d}" aria-pressed="${d === D}">${DIA_PT[d]}</button>`).join("")}</div>`;
  const head = `<h2>${PAR[D]}${D === diaDeFarm() ? " · hoje" : ""}</h2>`;
  if (D === "sunday") return chips + head + `<div class="card">🎉 Domingo todos os domínios de talento e arma estão liberados.</div>`;
  const b = days[D] || { chars: [], weapons: [] }, byName = (a, c) => a.n.localeCompare(c.n, "pt-BR"), out = [];
  for (const r of [5, 4]) {
    const cs = b.chars.filter((x) => x.r === r).sort(byName);
    if (cs.length) out.push(`<div class="card"><div class="t">Personagens ${r}★</div><div class="m">${cs.map((x) => esc(x.n)).join(", ")}</div></div>`);
  }
  const ord = j.farm.weaponOrder || [];
  for (const r of [5, 4]) {
    const ws = b.weapons.filter((x) => x.r === r), tipos = [...new Set(ws.map((x) => x.t))].sort((a, c) => (ord.indexOf(a) + 99) % 99 - (ord.indexOf(c) + 99) % 99);
    if (ws.length) out.push(`<div class="card"><div class="t">Armas ${r}★</div>${tipos.map((t) => `<div class="m"><b>${esc(t)}</b>: ${ws.filter((x) => x.t === t).sort(byName).map((x) => esc(x.n)).join(", ")}</div>`).join("")}</div>`);
  }
  return chips + head + (out.join("") || `<div class="m">Sem farm de talento/arma com dia fixo nesse dia.</div>`);
}
function viewCodigos(d) {
  const list = d;
  const link = `<a class="lnk" href="${GAMES[G].url}" data-ext>Resgatar no site oficial ↗</a>`;
  if (!list.length) return `<div class="m">Nenhum código ativo agora.</div>${link}`;
  return list.map((c) => `<div class="card"><div class="code"><code>${esc(c.code)}</code><button class="cp" data-cp="${esc(c.code)}">Copiar</button></div><div class="m">${esc(clean(String(c.rewards || "")))}</div></div>`).join("") + link
    + `<div class="m" style="margin-top:6px">Alguns códigos podem ser regionais e não funcionar em toda conta.</div>`;
}

async function render() {
  const my = ++tok;
  $("tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}" aria-pressed="${k === T}">${v}</button>`).join("");
  $("games").innerHTML = Object.entries(GAMES).map(([k, v]) => `<button data-g="${k}" aria-pressed="${k === G}">${v.n}</button>`).join("");
  if (T === "banners" && !GAMES[G].ban) { $("out").innerHTML = `<div class="m">A fonte não traz banners de Zenless Zone Zero.</div>`; $("up").textContent = ""; return; }
  if (T === "farm" && G !== "genshin") { $("out").innerHTML = `<div class="m">O farm diário de domínios existe só para Genshin Impact.</div>`; $("up").textContent = ""; return; }
  $("out").innerHTML = `<div class="m">Carregando…</div>`;
  try {
    if (T === "farm") {
      let r; try { r = await getBot(); } catch (e) { throw new Error("hoje.json indisponível (" + e.message + "): o bot precisa publicar o arquivo"); }
      if (my !== tok) return;
      $("out").innerHTML = viewFarm(r.d);
      $("up").textContent = "O dia de farm vai das 6h às 6h (Brasília) · atualizado pelo bot em " + (r.d.generatedAt ? new Date(r.d.generatedAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
      return;
    }
    const r = T === "codigos" ? await getCodes(G) : await get(calUrl(G));
    if (my !== tok) return;
    $("out").innerHTML = T === "eventos" ? viewEventos(r.d) : T === "banners" ? viewBanners(r.d) : viewCodigos(r.d);
    $("up").textContent = "Atualizado às " + new Date(r.t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + " · horários de Brasília, podem variar 1–2h (fonte: HoYoLAB)" + (r.src && r.src !== "hoyo-codes" && r.src !== "bot" ? " · códigos via " + r.src : "");
  } catch (e) {
    if (my !== tok) return;
    $("up").textContent = "";
    $("out").innerHTML = `<div class="err">Não consegui carregar agora.<br><button id="rt">Tentar de novo</button></div><div class="m" style="margin-top:8px">${esc(e && e.message)}</div>`;
    $("rt").onclick = () => { cache.clear(); render(); };
  }
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-t]"), g = e.target.closest("[data-g]"), c = e.target.closest("[data-cp]"), x = e.target.closest("[data-ext]"), dd = e.target.closest("[data-d]");
  if (t) { T = t.dataset.t; render(); }
  if (g) { G = g.dataset.g; render(); }
  if (dd) { D = dd.dataset.d; render(); }
  if (x && tg && tg.openLink) { e.preventDefault(); tg.openLink(x.href); }
  if (c) {
    const v = c.dataset.cp, ok = () => { c.textContent = "Copiado ✓"; setTimeout(() => { c.textContent = "Copiar"; }, 1500); };
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(ok, () => {
      const a = document.createElement("textarea"); a.value = v; document.body.appendChild(a); a.select();
      try { document.execCommand("copy"); ok(); } catch (_) {} a.remove();
    });
  }
});
(function init() {
  const q = new URLSearchParams(location.search);       // ?t=eventos|banners|codigos&g=genshin|hsr|zzz
  if (TABS[q.get("t")]) T = q.get("t"); if (GAMES[q.get("g")]) G = q.get("g");
  render();
})();
</script>
<script src="../extras.js"></script>
</body>
</html>

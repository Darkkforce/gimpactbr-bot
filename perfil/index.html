<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfil — Genshin e Star Rail</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#14131f);--sf:var(--tg-theme-secondary-bg-color,#1e1c2e);--tx:var(--tg-theme-text-color,#ecebf5);--hint:var(--tg-theme-hint-color,#9a97b5);--ac:var(--tg-theme-button-color,#8b7cf6);--act:var(--tg-theme-button-text-color,#fff)}
@media (prefers-color-scheme:light){:root{--bg:var(--tg-theme-bg-color,#fff);--sf:var(--tg-theme-secondary-bg-color,#f1f0f8);--tx:var(--tg-theme-text-color,#1b1a2b);--hint:var(--tg-theme-hint-color,#6b6985);--ac:var(--tg-theme-button-color,#5b4bd6)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 12px}h2{font-size:.95rem;margin:16px 0 6px;color:var(--hint);font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:9px 10px;border:0;border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--act);font-weight:600}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 12px;border:0;border-radius:10px;background:var(--sf);color:var(--tx);font:inherit}
.go{padding:0 18px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font:inherit;font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border-radius:14px;padding:12px;margin-top:10px}
.m{color:var(--hint);font-size:.85rem}.nick{font-size:1.15rem;font-weight:700}
details.ch{background:var(--sf);border-radius:14px;margin-top:8px;overflow:hidden}
details.ch summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
details.ch summary::-webkit-details-marker{display:none}
details.ch summary img{border-radius:50%;background:color-mix(in srgb,var(--hint) 20%,transparent);flex:none}
.in{padding:2px 12px 12px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;margin:6px 0}
.g div{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.g span{color:var(--hint)}
.wi{width:40px;height:40px;object-fit:contain;flex:none;border-radius:8px;background:color-mix(in srgb,var(--hint) 15%,transparent)}
.wi.big{width:52px;height:52px}
.row2{display:flex;gap:10px;align-items:center}
details.ch summary .txt{flex:1;min-width:0}
.art{border-top:1px solid color-mix(in srgb,var(--hint) 25%,transparent);padding:6px 0;font-size:.85rem}
.art b{font-size:.9rem}
.err{color:#e5484d}
</style>
</head>
<body>
<main>
<h1>Perfil</h1>
<div class="seg" id="games" role="group" aria-label="Jogo"></div>
<form class="row" id="f"><input id="uid" inputmode="numeric" maxlength="10" placeholder="Seu UID" autocomplete="off" aria-label="UID"><button class="go" type="submit">Buscar</button></form>
<div id="out" aria-live="polite"></div>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const API = "https://bot-vnic.tailbd6ffe.ts.net";      // endereço fixo da API do bot (Tailscale Funnel)
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const GAMES = { genshin: "Genshin Impact", hsr: "Star Rail" };
let G = "genshin", tok = 0;
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };

function head() {
  $("games").innerHTML = Object.entries(GAMES).map(([k, v]) => `<button type="button" data-g="${k}" aria-pressed="${k === G}">${v}</button>`).join("");
  $("uid").value = store.get("perfil_uid_" + G);
}
const stars = (n) => (n ? n + "★" : "");

function artifact(a) {
  return `<div class="art"><b>${esc(a.slot)}</b> · ${esc(a.set)} · +${a.level} ${stars(a.rarity)}<br>` +
    (a.main ? `<b>${esc(a.main.label)}: ${esc(a.main.value)}</b><br>` : "") + `<span class="m">${a.subs.map((s) => esc(s.label) + " " + esc(s.value)).join(" · ")}</span></div>`;
}
function genshinChar(c) {
  const s = c.stats, w = c.weapon;
  const g = [["Vida", s.hp], ["ATQ", s.atk], ["DEF", s.def], ["Prof. Elem.", s.em], ["Taxa Crít.", s.cr + "%"], ["Dano Crít.", s.cd + "%"], ["Recarga", s.er + "%"]];
  if (s.bonus) g.push([s.bonus.label, s.bonus.value]); if (s.heal) g.push(["Cura", s.heal]);
  return `<div class="in"><div class="m">Talentos: ${c.talents.map((t) => esc(t)).join(" / ") || "—"}${c.friendship ? " · Amizade " + c.friendship : ""}</div>` +
    (w ? `<div class="card row2" style="margin:8px 0">${w.icon ? `<img class="wi big" src="${esc(w.icon)}" alt="" width="52" height="52" loading="lazy" onerror="this.style.display='none'">` : ""}<div><b>${esc(w.name)}</b> ${stars(w.rarity)}<br><span class="m">Nv. ${w.level} · R${w.refine}${w.atk ? " · ATQ base " + w.atk : ""}${w.sub ? " · " + esc(w.sub.label) + " " + esc(w.sub.value) : ""}</span></div></div>` : "") +
    `<div class="g">${g.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>${c.artifacts.map(artifact).join("")}</div>`;
}
function hsrChar(c) {
  if (c.noDetail || !c.stats) return `<div class="in m">Detalhes deste personagem indisponíveis no momento.${c.detailError ? `<br><small>Motivo: ${esc(c.detailError)}</small>` : ""}</div>`;
  const lc = c.lightCone;
  return `<div class="in">` +
    (lc ? `<div class="card row2" style="margin:8px 0">${lc.icon ? `<img class="wi big" src="${esc(lc.icon)}" alt="" width="52" height="52" loading="lazy" onerror="this.style.display='none'">` : ""}<div><b>${esc(lc.name)}</b> ${stars(lc.rarity)}<br><span class="m">Nv. ${lc.level} · S${lc.superimpose} · HP ${lc.hp} · ATQ ${lc.atk} · DEF ${lc.def}</span></div></div>` : `<div class="m" style="margin:6px 0">Sem cone de luz equipado.</div>`) +
    `<div class="g">${c.stats.map((s) => `<div><span>${esc(s.label)}</span><b>${esc(s.value)}</b></div>`).join("")}</div>` +
    (c.sets && c.sets.length ? `<div class="m" style="margin:6px 0">Conjuntos: ${c.sets.map((s) => `${esc(s.name)} (${s.count}pç)`).join(" · ")}</div>` : "") +
    (c.relics || []).map((r) => `<div class="art"><b>${esc(r.slot)}</b> · ${esc(r.set)} · +${r.level} ${stars(r.rarity)}<br>` +
      (r.main ? `<b>${esc(r.main.label)}: ${esc(r.main.value)}</b><br>` : "") +
      `<span class="m">${r.subs.map((s) => esc(s.label) + " " + esc(s.value)).join(" · ")}</span></div>`).join("") + `</div>`;
}
function charCard(c, game) {
  const sub = [`Nv. ${c.level}`, game === "hsr" ? "E" + c.eidolon : "C" + c.constellation, stars(c.rarity), esc(c.element), esc(c.path)].filter(Boolean).join(" · ");
  const img = c.icon ? `<img src="${esc(c.icon)}" alt="" width="44" height="44" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span style="width:44px"></span>`;
  const eq = game === "genshin" ? c.weapon : c.lightCone;
  const mini = eq && eq.icon ? `<img class="wi" src="${esc(eq.icon)}" alt="" title="${esc(eq.name)}" width="40" height="40" loading="lazy" onerror="this.style.visibility='hidden'">` : "";
  return `<details class="ch"><summary>${img}<span class="txt"><b>${esc(c.name)}</b><br><span class="m">${sub}</span></span>${mini}</summary>${game === "genshin" ? genshinChar(c) : hsrChar(c)}</details>`;
}
function render(d) {
  const p = d.player;
  const meta = [`Nv. ${p.level ?? "?"}`, p.worldLevel != null ? `Mundo ${p.worldLevel}` : "", p.achievements != null ? `${p.achievements} conquistas` : "", p.abyss ? `Abismo ${p.abyss}` : ""].filter(Boolean).join(" · ");
  let h = `<div class="card"><div class="nick">${esc(p.nickname)}</div><div class="m">UID ${esc(d.uid)} · ${esc(meta)}</div>${p.signature ? `<div class="m" style="margin-top:6px">${esc(p.signature)}</div>` : ""}</div>`;
  h += d.characters.length ? `<h2>Vitrine (${d.characters.length})</h2>` + d.characters.map((c) => charCard(c, d.game)).join("")
    : `<div class="card m">Este jogador deixou a vitrine de personagens oculta, ou ainda não escolheu personagens para exibir.</div>`;
  $("out").innerHTML = h;
}

async function search(e) {
  if (e) e.preventDefault();
  const uid = $("uid").value.replace(/\D/g, "");
  if (!/^\d{9,10}$/.test(uid)) { $("out").innerHTML = `<div class="err card">O UID tem 9 ou 10 números.</div>`; return; }
  if (!tg || !tg.initData) { $("out").innerHTML = `<div class="err card">Abra esta miniapp pelo Telegram (pelo bot), não pelo navegador.</div>`; return; }
  store.set("perfil_uid_" + G, uid);
  const my = ++tok; $("out").innerHTML = `<div class="m card">Buscando…</div>`;
  try {
    const r = await fetch(`${API}/api/enka/${G}/${uid}`, { headers: { Authorization: "tma " + tg.initData } });
    const d = await r.json().catch(() => ({}));
    if (my !== tok) return;
    if (!r.ok) throw new Error(d.error || `Erro ${r.status}`);
    render(d);
  } catch (err) {
    if (my !== tok) return;
    const falhaRede = err instanceof TypeError;
    $("out").innerHTML = `<div class="err card">${esc(falhaRede ? "Não consegui falar com o servidor do bot. Tente de novo em instantes." : err.message)}</div>`;
  }
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-g]"); if (b) { G = b.dataset.g; head(); $("out").innerHTML = ""; } });
$("f").addEventListener("submit", search);
(function init() {
  const q = new URLSearchParams(location.search);       // ?g=genshin|hsr&u=<uid>
  if (GAMES[q.get("g")]) G = q.get("g");
  head();
  if (q.get("u")) { $("uid").value = q.get("u"); search(); } else if ($("uid").value) search();
})();
</script>
<script src="../extras.js"></script>
</body>
</html>

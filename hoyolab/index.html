<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoYoLAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#14131f);--sf:var(--tg-theme-secondary-bg-color,#1e1c2e);--tx:var(--tg-theme-text-color,#ecebf5);--hint:var(--tg-theme-hint-color,#9a97b5);--ac:var(--tg-theme-button-color,#8b7cf6);--act:var(--tg-theme-button-text-color,#fff)}
@media (prefers-color-scheme:light){:root{--bg:var(--tg-theme-bg-color,#fff);--sf:var(--tg-theme-secondary-bg-color,#f1f0f8);--tx:var(--tg-theme-text-color,#1b1a2b);--hint:var(--tg-theme-hint-color,#6b6985);--ac:var(--tg-theme-button-color,#5b4bd6)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--hint);font-size:.85rem;margin:0 0 14px}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}.btn.alt{background:color-mix(in srgb,var(--hint) 28%,transparent);color:var(--tx);font-weight:500}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:1rem;margin:0 0 8px}
.ln{min-height:1.2em;overflow-wrap:anywhere}
.ln b{font-weight:700}.ln code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:color-mix(in srgb,var(--hint) 20%,transparent);padding:0 4px;border-radius:4px}
.warn{color:#e5a100;font-size:.85rem;margin-top:8px}
.err{color:#e5484d}
.m{color:var(--hint);font-size:.82rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{padding:8px 12px;border:0;border-radius:10px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--act);font-weight:600}
.sep{border-top:1px solid color-mix(in srgb,var(--hint) 25%,transparent);margin:10px 0}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.nav .btn{padding:7px 12px}
textarea{width:100%;padding:10px 12px;border:0;border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;resize:vertical}
textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>HoYoLAB</h1>
<p class="sub">🔒 Dados da sua conta: só você vê esta tela. Os cookies ficam guardados no servidor do bot e nunca chegam aqui.</p>
<div class="seg" id="tabs" role="group" aria-label="Seção"></div>
<div class="seg" id="contas" role="group" aria-label="Conta"></div>
<div class="row"><button class="btn" id="ref">Atualizar</button><span class="m" id="info"></span></div>
<div id="out"><div class="m">Carregando…</div></div>
</main>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const API = "https://bot-vnic.tailbd6ffe.ts.net";      // endereço fixo da API do bot (Tailscale Funnel)
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };   // sempre textContent: nada de innerHTML com dado do servidor
const TABS = { perfil: "Perfil", diario: "Diário", endgame: "Endgame", resgatar: "Resgatar" };
const S = { tab: "perfil", conta: null, contas: [], mes: null, modo: 0, ciclo: 0, andar: null, dados: {} };   // dados[tab+conta+mes] = última resposta
let busy = false;

function renderLinha(segs) {
  const d = el("div", "ln");
  if (!segs.length) { d.appendChild(document.createTextNode("\u00a0")); return d; }
  for (const s of segs) {
    let n = document.createTextNode(s.t);
    if (s.c) { const c = el("code"); c.appendChild(n); n = c; }
    if (s.b) { const b = el("b"); b.appendChild(n); n = b; }
    if (s.i) { const i = el("i"); i.appendChild(n); n = i; }
    d.appendChild(n);
  }
  return d;
}
const linhasEm = (box, lines) => lines.forEach((l) => box.appendChild(renderLinha(l)));
function mensagem(txt, cls, extra) { const c = el("div", "card " + (cls || ""), txt); if (extra) c.appendChild(extra); $("out").replaceChildren(c); }
function botoes(box, itens, ativo, onClick) {
  box.replaceChildren();
  itens.forEach(([chave, rotulo]) => { const b = el("button", "", rotulo); b.type = "button"; b.setAttribute("aria-pressed", String(chave === ativo)); b.onclick = () => onClick(chave); box.appendChild(b); });
}
function cabecalho() {
  botoes($("tabs"), Object.entries(TABS), S.tab, (t) => { pararPoll(); S.tab = t; S.modo = 0; S.ciclo = 0; S.andar = null; carregar(false); });
  $("ref").style.display = S.tab === "resgatar" ? "none" : "";
  const multi = S.tab !== "perfil" && S.contas.length > 1;
  $("contas").style.display = multi ? "" : "none";
  if (multi) botoes($("contas"), S.contas.map((c) => [c.idx, c.label]), S.conta, (i) => { S.conta = i; S.modo = 0; S.ciclo = 0; S.andar = null; carregar(false); });
}
const abrirBot = () => { const u = "https://t.me/gimpactbr_bot"; tg && tg.openTelegramLink ? tg.openTelegramLink(u) : window.open(u); };
function avisoAuth(box) { box.appendChild(el("div", "warn", "⚠️ O cookie desta conta pode ter expirado. Use /vincular de novo no privado com o bot para atualizar.")); }

function viewPerfil(d) {
  const o = $("out"); o.replaceChildren();
  for (const a of d.accounts) { const c = el("div", "card"); c.appendChild(el("h2", "", a.label)); linhasEm(c, a.lines); if (a.authError) avisoAuth(c); o.appendChild(c); }
}
function viewDiario(d) {
  const o = $("out"); o.replaceChildren();
  const meses = el("div", "seg"); botoes(meses, d.meses.map((m) => [m.mes, m.label]), d.mes, (m) => { S.mes = m; carregar(false); }); o.appendChild(meses);
  if (d.semJogo) return o.appendChild(el("div", "card m", "Esta conta não tem Genshin nem ZZZ ativados (o diário do Star Rail está fora do ar na HoYoverse). Veja /jogosativos no bot."));
  d.blocks.forEach((b) => { const c = el("div", "card"); linhasEm(c, b); o.appendChild(c); });
  if (d.authError) { const c = el("div", "card"); avisoAuth(c); o.appendChild(c); }
}
function viewEndgame(d) {
  const o = $("out"); o.replaceChildren();
  if (d.semJogo || !d.pages.length) return o.appendChild(el("div", "card m", "Esta conta não tem Genshin nem Star Rail ativados. Veja /jogosativos no bot."));
  S.modo = Math.min(S.modo, d.pages.length - 1);
  const page = d.pages[S.modo], jogos = [...new Set(d.pages.map((p) => p.game))];
  for (const jogo of jogos) {                                   // uma linha de botões por jogo, como no bot
    const linha = el("div", "seg"); const itens = []; d.pages.forEach((p, i) => { if (p.game === jogo) itens.push([i, p.label]); });
    botoes(linha, itens, S.modo, (i) => { S.modo = i; S.ciclo = 0; S.andar = null; viewEndgame(d); }); o.appendChild(linha);
  }
  S.ciclo = Math.min(S.ciclo, page.cycles.length - 1);
  if (page.cycles.length > 1) { const c = el("div", "seg"); botoes(c, page.cycles.map((x, i) => [i, x.name]), S.ciclo, (i) => { S.ciclo = i; S.andar = null; viewEndgame(d); }); o.appendChild(c); }
  const ciclo = page.cycles[S.ciclo], card = el("div", "card");
  if (ciclo.items) {
    linhasEm(card, ciclo.header || []);
    if (ciclo.items.length) {
      const pos = S.andar != null ? Math.min(S.andar, ciclo.items.length - 1) : ciclo.items.length - 1;   // padrão: o último (mais alto/recente)
      if (ciclo.items.length > 1) {
        const nav = el("div", "nav"), ant = el("button", "btn alt", "◀ " + ciclo.rotulo + " " + (pos > 0 ? ciclo.items[pos - 1].index : "")), cur = el("span", "m", ciclo.rotulo + " " + ciclo.items[pos].index), prox = el("button", "btn alt", (pos < ciclo.items.length - 1 ? ciclo.rotulo + " " + ciclo.items[pos + 1].index : "") + " ▶");
        ant.disabled = pos <= 0; prox.disabled = pos >= ciclo.items.length - 1;
        ant.onclick = () => { S.andar = pos - 1; viewEndgame(d); }; prox.onclick = () => { S.andar = pos + 1; viewEndgame(d); };
        nav.append(ant, cur, prox); card.appendChild(nav);
      }
      card.appendChild(el("div", "sep")); linhasEm(card, ciclo.items[pos].lines);
    }
  } else linhasEm(card, ciclo.lines);
  o.appendChild(card);
  if (d.authError) { const c = el("div", "card"); avisoAuth(c); o.appendChild(c); }
}

async function chamar(path, body) {
  const r = await fetch(API + path, body === undefined ? { headers: { Authorization: "tma " + tg.initData } } : { method: "POST", headers: { Authorization: "tma " + tg.initData, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401) throw new Error("Sessão expirada. Feche e abra a miniapp de novo pelo Telegram."); throw new Error(d.error || "Erro " + r.status); }
  return d;
}
async function carregar(forcar) {
  cabecalho();
  if (busy) return;
  if (!tg || !tg.initData) return mensagem("Abra esta miniapp pelo Telegram (pelo bot), não pelo navegador.", "err");
  if (S.tab === "resgatar") return carregarResgate();
  const qs = new URLSearchParams();
  if (S.tab !== "perfil" && S.conta) qs.set("conta", S.conta);
  if (S.tab === "diario" && S.mes) qs.set("mes", S.mes);
  if (forcar && S.tab !== "perfil") qs.set("refresh", "1");
  busy = true; $("ref").disabled = true; $("info").textContent = S.tab === "endgame" ? "Buscando… pode levar até 30 s." : "";
  const tab = S.tab;
  try {
    const d = await chamar(`/api/hoyolab/${tab}${qs.toString() ? "?" + qs : ""}`);
    if (tab !== S.tab) return;                                   // trocou de aba enquanto carregava
    if (tab === "perfil") {
      if (d.semConta) { const b = el("button", "btn alt", "Abrir o bot"); b.style.marginTop = "10px"; b.onclick = abrirBot; return mensagem("Você ainda não vinculou uma conta HoYoLAB. Por segurança isso é feito só no privado com o bot, com o comando /vincular (não por esta tela).", "", b); }
      S.contas = d.accounts.map((a) => ({ idx: a.idx, label: a.label }));
      if (!S.conta && S.contas.length) S.conta = S.contas[0].idx;
      if (!d.accounts.length) return mensagem("Nenhum jogo ativado para mostrar. Use /jogosativos no bot para ligar Genshin, Star Rail ou ZZZ.");
      viewPerfil(d);
    } else {
      S.contas = d.contas; S.conta = d.conta.idx;
      if (tab === "diario") { S.mes = d.mes; viewDiario(d); } else viewEndgame(d);
    }
    cabecalho();
    $("info").textContent = d.cachedSecondsAgo > 2 ? `Atualizado há ${d.cachedSecondsAgo}s` : "Atualizado agora";
  } catch (e) {
    const falhaRede = e instanceof TypeError, txt = falhaRede ? "Não consegui falar com o servidor do bot. Tente de novo em instantes." : e.message;
    if (!$("out").querySelector(".ln")) mensagem(txt, "err"); else $("info").textContent = txt;
  } finally { busy = false; $("ref").disabled = false; if (tab !== S.tab) carregar(false); }   // trocou de aba durante a busca: carrega a aba atual
}
// ---------- RESGATAR (códigos digitados à mão) ----------
const JOGO_NOME = { genshin: "Genshin Impact", hsr: "Honkai: Star Rail", zzz: "Zenless Zone Zero" };
const ICONE = { used: "✅", not_used: "⛔", unconfirmed: "❔" };
const CODIGO_RE = /^[A-Z0-9]{4,32}$/;
const R = { form: { codes: "", games: new Set() }, jogos: [], semCookies: false, job: null };
let POLL = null;
function pararPoll() { if (POLL) { clearInterval(POLL); POLL = null; } }
function lerCodigos(txt) {
  const out = [];
  for (const c of String(txt).split(/[\s,;]+/)) { const cod = c.trim().toUpperCase(); if (!cod) continue; if (!CODIGO_RE.test(cod)) throw new Error(`Código inválido: "${cod.slice(0, 20)}". Use só letras e números (de 4 a 32 caracteres).`); if (!out.includes(cod)) out.push(cod); }
  return out;
}
function formResgate() {
  const o = $("out"); o.replaceChildren();
  const card = el("div", "card");
  if (R.semCookies) {
    card.appendChild(el("div", "warn", "Esta conta ainda não tem os cookies de resgate. Configure com /vincularresgate no privado com o bot (por segurança, isso não é feito por esta tela)."));
    o.appendChild(card); const r = el("div", "", ""); r.id = "resgRes"; o.appendChild(r); return;
  }
  card.appendChild(el("h2", "", "Resgatar código(s)"));
  const ta = el("textarea"); ta.id = "resgCodes"; ta.rows = 3; ta.maxLength = 400; ta.placeholder = "Digite os códigos: um por linha, ou separados por espaço ou vírgula"; ta.value = R.form.codes;
  ta.setAttribute("aria-label", "Códigos a resgatar"); ta.autocapitalize = "characters"; ta.spellcheck = false; ta.oninput = () => { R.form.codes = ta.value; };
  card.appendChild(ta);
  const jg = el("div", "seg"); jg.style.marginTop = "10px"; jg.appendChild(el("span", "m", "Jogo(s):"));
  if (R.jogos.length === 1) R.form.games = new Set(R.jogos);
  for (const g of R.jogos) {
    const b = el("button", "", JOGO_NOME[g]); b.type = "button"; b.setAttribute("aria-pressed", String(R.form.games.has(g)));
    b.onclick = () => { R.form.games.has(g) ? R.form.games.delete(g) : R.form.games.add(g); b.setAttribute("aria-pressed", String(R.form.games.has(g))); };
    jg.appendChild(b);
  }
  card.appendChild(jg);
  card.appendChild(el("div", "m", "Escolha o jogo certo: tentar um código no jogo errado só retorna “inválido”. Cada código resgatado é consumido e isso não pode ser desfeito. O resultado de cada um vem da resposta da própria HoYoverse."));
  const b = el("button", "btn", "Resgatar"); b.id = "resgBtn"; b.style.marginTop = "10px"; b.onclick = iniciarResgate; card.appendChild(b);
  const msg = el("div", "warn"); msg.id = "resgMsg"; card.appendChild(msg);
  o.appendChild(card);
  const r = el("div"); r.id = "resgRes"; o.appendChild(r);
}
function mostrarJob(job) {
  R.job = job;
  const rodando = !!job && job.state === "running", btn = $("resgBtn");
  if (btn) { btn.disabled = rodando; btn.textContent = rodando ? "Resgatando…" : "Resgatar"; }
  const box = $("resgRes"); if (!box) return; box.replaceChildren();
  if (!job) return;
  const r = job.resumo, sum = el("div", "card");
  sum.appendChild(el("h2", "", (rodando ? "Resgatando… " : job.state === "error" ? "Interrompido — " : "Concluído — ") + job.conta.label));
  sum.appendChild(el("div", "", `✅ ${r.used} usado(s) · ⛔ ${r.not_used} não usado(s) · ❔ ${r.unconfirmed} não confirmado(s)`));
  if (job.erro) sum.appendChild(el("div", "warn", job.erro));
  if (r.unconfirmed) sum.appendChild(el("div", "warn", "❔ Não confirmado = não deu para saber se foi usado. Confira o correio do jogo antes de tentar de novo."));
  box.appendChild(sum);
  for (const g of ["genshin", "hsr", "zzz"]) {
    const itens = job.results.filter((x) => x.game === g);
    if (!itens.length && !(rodando && job.plano.games.includes(g))) continue;
    const c = el("div", "card"); c.appendChild(el("h2", "", JOGO_NOME[g]));
    for (const x of itens) {
      const l = el("div", "ln"); l.appendChild(document.createTextNode(ICONE[x.kind] + " "));
      const code = el("code"); code.textContent = x.code; l.appendChild(code); l.appendChild(document.createTextNode(" — " + x.text)); c.appendChild(l);
    }
    if (!itens.length) c.appendChild(el("div", "m", "Aguardando…"));
    box.appendChild(c);
  }
  if (rodando) box.appendChild(el("div", "m", "Cerca de 6 s por código. Atualizando a cada 2 segundos…"));
}
function iniciarPoll(id) {
  pararPoll();
  POLL = setInterval(async () => {
    if (S.tab !== "resgatar") return pararPoll();
    try { const d = await chamar("/api/hoyolab/resgatar/" + encodeURIComponent(id)); mostrarJob(d.job); if (d.job.state !== "running") pararPoll(); }
    catch (e) { if (/não encontrado/.test(e.message)) pararPoll(); }      // falha de rede: tenta de novo no próximo ciclo
  }, 2000);
}
async function carregarResgate() {
  pararPoll(); $("info").textContent = "";
  try {
    const d = await chamar("/api/hoyolab/resgatar/atual" + (S.conta ? "?conta=" + S.conta : ""));
    S.contas = d.contas; S.conta = d.conta.idx; R.jogos = d.jogos; R.semCookies = d.semCookiesResgate;
    R.form.games = new Set([...R.form.games].filter((g) => R.jogos.includes(g)));
    cabecalho(); formResgate(); mostrarJob(d.job);
    if (d.job && d.job.state === "running") iniciarPoll(d.job.id);       // reabriu a miniapp com um resgate em andamento: retoma
  } catch (e) { mensagem(e instanceof TypeError ? "Não consegui falar com o servidor do bot. Tente de novo em instantes." : e.message, "err"); }
}
async function iniciarResgate() {
  const aviso = (t) => { const m = $("resgMsg"); if (m) m.textContent = t; };
  aviso("");
  let codes; try { codes = lerCodigos($("resgCodes").value); } catch (e) { return aviso(e.message); }
  if (!codes.length) return aviso("Digite pelo menos um código.");
  const games = [...R.form.games];
  if (!games.length) return aviso("Escolha o jogo (ou os jogos) em que quer resgatar.");
  const txt = `Resgatar ${codes.length} código(s) em ${games.map((g) => JOGO_NOME[g]).join(" e ")}?\n\n${codes.join(", ")}\n\nCada código resgatado é consumido e isso não pode ser desfeito.`;
  const ok = await new Promise((res) => (tg && tg.showConfirm ? tg.showConfirm(txt, res) : res(window.confirm(txt))));
  if (!ok) return;
  try {
    const d = await chamar("/api/hoyolab/resgatar", { conta: S.conta, games, codes });
    mostrarJob(d.job); if (d.job.state === "running") iniciarPoll(d.job.id);
    if (d.retomado) aviso("Já havia um resgate seu em andamento; estou acompanhando esse.");
  } catch (e) { aviso(e instanceof TypeError ? "Sem conexão com o bot." : e.message); }
}
$("ref").addEventListener("click", () => carregar(true));
(function init() {
  const q = new URLSearchParams(location.search);               // ?t=perfil|diario|endgame
  if (TABS[q.get("t")]) S.tab = q.get("t");
  carregar(false);
})();
</script>
<script src="../extras.js"></script>
</body>
</html>
